
name: Compilar APK Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ISO-CHD-Android-Projeto-v1.6-dev.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          unzip -q ISO-CHD-Android-Projeto-v1.6-dev.zip
          test -f ISO-CHD-Android/app/build.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK, NDK e CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Testar conversor C++
        working-directory: ISO-CHD-Android
        run: bash scripts/test-native.sh

      - name: Compilar APK
        working-directory: ISO-CHD-Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ISO-CHD-Converter-ARM64
          path: ISO-CHD-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
