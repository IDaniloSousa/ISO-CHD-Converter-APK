
name: Compilar APK Android ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ISO-CHD-Android-Projeto-v1.6-dev.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          unzip -q ISO-CHD-Android-Projeto-v1.6-dev.zip
          test -f ISO-CHD-Android/app/build.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Instalar SDK NDK e CMake
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verificar ferramentas Android
        run: |
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Java:"
          java -version

          echo "Gradle:"
          gradle --version

          echo "NDK:"
          ls "$ANDROID_HOME/ndk/27.2.12479018"

      - name: Testar conversor C++
        working-directory: ISO-CHD-Android
        run: |
          bash scripts/test-native.sh

      - name: Compilar APK Android ARM64
        working-directory: ISO-CHD-Android
        run: |
          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ISO-CHD-Converter-ARM64-v1.6
          path: ISO-CHD-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
